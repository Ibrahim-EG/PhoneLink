plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.ibrahim.phonelink'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ibrahim.phonelink'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '0.1'
    }
    signingConfigs {
        debug { enableV1Signing = true; enableV2Signing = true }
    }
    buildTypes { debug { debuggable = false } }
    // debuggable=false makes lint-vital treat this variant as a release target. Only the Google Play publishing rule ExpiredTargetSdkVersion
    // (targetSdk 28 is deliberate for Android 7 and this APK is sideloaded, not published) is downgraded to a warning; every other fatal lint check still fails the build.
    lint { warning += ['ExpiredTargetSdkVersion'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
