name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.5' }
      - run: gradle -p android assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PhoneLink.apk
      - uses: actions/upload-artifact@v4
        with: { name: phonelink-android-apk, path: PhoneLink.apk }
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: cd windows && go test ./... && GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o PhoneLink.exe .
      - uses: actions/upload-artifact@v4
        with: { name: phonelink-windows, path: windows/PhoneLink.exe }
  release:
    needs: [android, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/PhoneLink.apk out/PhoneLink.exe \
            --repo "${{ github.repository }}" --title "PhoneLink build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}. Debug-signed APK, unsigned Windows exe."
