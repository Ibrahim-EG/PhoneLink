name: build
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.5' }
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: phonelink-android-apk, path: android/app/build/outputs/apk/debug/*.apk }
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: cd windows && go test ./... && GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o phonelink.exe .
      - uses: actions/upload-artifact@v4
        with: { name: phonelink-windows, path: windows/phonelink.exe }
