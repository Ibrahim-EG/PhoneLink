name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.5' }
      - run: gradle -p android testDebugUnitTest assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PhoneLink.apk
      - uses: actions/upload-artifact@v4
        with: { name: phonelink-android-apk, path: PhoneLink.apk }
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Test, embed icon + manifest, build native Windows exe
        run: |
          cd windows
          go test ./...
          go run . -write-ico icon.ico
          go install github.com/akavel/rsrc@v0.10.2
          "$(go env GOPATH)/bin/rsrc" -manifest app.manifest -ico icon.ico -o rsrc_windows_amd64.syso
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -H windowsgui" -o PhoneLink.exe .
      - uses: actions/upload-artifact@v4
        with: { name: phonelink-windows, path: windows/PhoneLink.exe }
  emulator:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: phonelink-android-apk, path: apk }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Build PC app for the end-to-end test (test-only build, auto-accepts pairing)
        run: cd windows && go build -tags e2e -o ../pc-e2e .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86
          target: default
          disable-animations: true
          script: bash .github/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: emulator-screens, path: shots }
      - name: Publish screenshots (public prerelease ci-evidence, not an app build)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-evidence --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create ci-evidence --repo "${{ github.repository }}" --prerelease --title "CI evidence (screenshots)" --notes "Screenshots from CI test runs. Not an app build."
          for f in shots/*.png; do [ -e "$f" ] && cp "$f" "android-run${{ github.run_number }}-$(basename $f)" && gh release upload ci-evidence "android-run${{ github.run_number }}-$(basename $f)" --repo "${{ github.repository }}" --clobber; done; true
  winshot:
    needs: [windows]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: phonelink-windows, path: exe }
      - name: Run the real app and screenshot its window
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process -FilePath .\exe\PhoneLink.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "PhoneLink.exe exited with code $($p.ExitCode)"; exit 1 }
          "window title: [$($p.MainWindowTitle)] handle: $($p.MainWindowHandle)" | Tee-Object shots\info.txt
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shots\desktop.png")
          if ($p.MainWindowHandle -eq 0) { Write-Error "no main window"; exit 1 }
      - name: Publish screenshots
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-evidence --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create ci-evidence --repo "${{ github.repository }}" --prerelease --title "CI evidence (screenshots)" --notes "Screenshots from CI test runs. Not an app build."
          for f in shots/*.png; do [ -e "$f" ] && cp "$f" "windows-run${{ github.run_number }}-$(basename $f)" && gh release upload ci-evidence "windows-run${{ github.run_number }}-$(basename $f)" --repo "${{ github.repository }}" --clobber; done; true
  release:
    needs: [android, windows, emulator, winshot]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/PhoneLink.apk out/PhoneLink.exe \
            --repo "${{ github.repository }}" --title "PhoneLink build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}. Debug-signed APK, unsigned Windows exe."
