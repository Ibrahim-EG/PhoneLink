name: build
on: workflow_dispatch
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.5' }
      - run: gradle -p android testDebugUnitTest assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PhoneLink.apk
      - uses: actions/upload-artifact@v4
        with: { name: phonelink-android-apk, path: PhoneLink.apk }
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Test, embed icon + manifest, build native Windows exe
        run: |
          cd windows
          go test ./...
          go run . -write-ico icon.ico
          go install github.com/akavel/rsrc@v0.10.2
          "$(go env GOPATH)/bin/rsrc" -manifest app.manifest -ico icon.ico -o rsrc_windows_amd64.syso
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -H windowsgui" -o PhoneLink.exe .
      - uses: actions/upload-artifact@v4
        with: { name: phonelink-windows, path: windows/PhoneLink.exe }
      - name: Guard - the release exe must not contain the sample pairing code or auto-accept
        shell: bash
        run: |
          cd windows
          GOOS=windows GOARCH=amd64 go build -tags sample -ldflags "-s -w -H windowsgui" -o /tmp/ctl-sample.exe .
          grep -c "(SAMPLE)" /tmp/ctl-sample.exe | grep -qv '^0$' || { echo "control failed: sample build lacks the marker"; exit 1; }
          if grep -q "(SAMPLE)" PhoneLink.exe; then echo "release exe contains the sample marker"; exit 1; fi
          echo "OK release exe has no sample marker (control build does)"
      - name: Test-only sample build (layout screenshots, fake pairing code, never released)
        run: cd windows && GOOS=windows GOARCH=amd64 go build -tags sample -ldflags "-s -w -H windowsgui" -o PhoneLink-sample.exe .
      - uses: actions/upload-artifact@v4
        with: { name: phonelink-windows-sample, path: windows/PhoneLink-sample.exe }
  emulator:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: phonelink-android-apk, path: apk }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Build PC app for the end-to-end test (test-only build, auto-accepts pairing)
        run: cd windows && go build -tags e2e -o ../pc-e2e .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86
          target: default
          disable-animations: true
          script: bash .github/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: emulator-screens, path: shots }
      - name: Publish screenshots (public prerelease ci-evidence, not an app build)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-evidence --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create ci-evidence --repo "${{ github.repository }}" --prerelease --title "CI evidence (screenshots)" --notes "Screenshots from CI test runs. Not an app build."
          for f in shots/*.png; do [ -e "$f" ] && cp "$f" "android-run${{ github.run_number }}-$(basename $f)" && gh release upload ci-evidence "android-run${{ github.run_number }}-$(basename $f)" --repo "${{ github.repository }}" --clobber; done; true
  winshot:
    needs: [windows]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: phonelink-windows, path: exe }
      - uses: actions/download-artifact@v4
        with: { name: phonelink-windows-sample, path: exe-sample }
      - name: Run the real app and screenshot its window
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public struct RECT { public int Left, Top, Right, Bottom; }
          public class W { [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
                           [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); }
          "@
          $p = Start-Process -FilePath .\exe\PhoneLink.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "PhoneLink.exe exited with code $($p.ExitCode)"; exit 1 }
          if ($p.MainWindowHandle -eq 0) { Write-Error "no main window"; exit 1 }
          [W]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 1
          function Shot($name) {
            $r = New-Object RECT; [W]::GetWindowRect($p.MainWindowHandle, [ref]$r) | Out-Null
            $w = $r.Right - $r.Left; $h = $r.Bottom - $r.Top
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.Left, $r.Top, 0, 0, (New-Object System.Drawing.Size $w, $h))
            $bmp.Save("shots\$name.png"); "$name ${w}x${h} at $($r.Left),$($r.Top)"
          }
          Shot "window1"
          $r = New-Object RECT; [W]::GetWindowRect($p.MainWindowHandle, [ref]$r) | Out-Null
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ($r.Left + 380), ($r.Top + 90)
          Start-Sleep -Seconds 3
          Shot "window2"
          $p.Kill()
          # Motion check on the TEST-ONLY sample build (fake pairing code, not a real pairing): record the window region as video
          $p = Start-Process -FilePath .\exe-sample\PhoneLink-sample.exe -PassThru
          Start-Sleep -Seconds 6
          [W]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 1
          choco install ffmpeg -y --no-progress | Select-Object -Last 2
          $ff = (Get-Command ffmpeg).Source
          $r = New-Object RECT; [W]::GetWindowRect($p.MainWindowHandle, [ref]$r) | Out-Null
          $w = $r.Right - $r.Left; $h = $r.Bottom - $r.Top; $w -= $w % 2; $h -= $h % 2
          $rec = Start-Process -FilePath $ff -ArgumentList "-y -f gdigrab -framerate 30 -offset_x $($r.Left) -offset_y $($r.Top) -video_size ${w}x${h} -draw_mouse 1 -i desktop -t 8 -c:v libx264 -preset ultrafast -pix_fmt yuv420p $PWD\shots\window-motion.mp4" -PassThru -NoNewWindow -RedirectStandardError $PWD\shots\ffmpeg-rec.log
          Start-Sleep -Seconds 1
          for ($i = 0; $i -lt 180; $i++) {
            $x = $r.Left + 40 + [int](($w - 80) * (0.5 + 0.45 * [math]::Sin($i / 9.0)))
            $y = $r.Top + 40 + [int](($h - 80) * (0.5 + 0.45 * [math]::Sin($i / 13.0 + 1.0)))
            [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point $x, $y
            Start-Sleep -Milliseconds 35
          }
          $rec.WaitForExit(20000) | Out-Null
          Get-Content shots\ffmpeg-rec.log -ErrorAction SilentlyContinue | Select-Object -Last 6
          Get-ChildItem shots | Select-Object Name, Length
          # per-frame mean brightness of the header strip (a white erase would spike it)
          & $ff -hide_banner -i "$PWD\shots\window-motion.mp4" -vf "crop=iw:130:0:40,signalstats,metadata=print:key=lavfi.signalstats.YAVG:file=yavg.txt" -f null - 2> shots\ffmpeg-stats.log
          Get-Content shots\ffmpeg-stats.log -ErrorAction SilentlyContinue | Select-Object -Last 4
          $v = @(Get-Content yavg.txt -ErrorAction SilentlyContinue | Where-Object { $_ -match 'YAVG=' } | ForEach-Object { [double]($_ -replace '.*YAVG=', '') })
          $d = 0.0; for ($i = 1; $i -lt $v.Count; $i++) { $q = [math]::Abs($v[$i] - $v[$i-1]); if ($q -gt $d) { $d = $q } }
          $m = $v | Measure-Object -Minimum -Maximum -Average
          $rep = @("frames: $($v.Count)", "header-strip mean brightness (0-255): min $([math]::Round($m.Minimum,1)) avg $([math]::Round($m.Average,1)) max $([math]::Round($m.Maximum,1))", "largest frame-to-frame change: $([math]::Round($d,1))", "SAMPLE build with a made-up pairing code; recording is of the window region only")
          $v | ForEach-Object { [math]::Round($_,1) } | Out-File shots\header-brightness-per-frame.txt
          $rep | Out-File shots\motion-report.txt -Encoding utf8
          $rep
          foreach ($t in 1, 2.5, 4, 5.5) { & $ff -hide_banner -loglevel error -y -ss $t -i shots\window-motion.mp4 -frames:v 1 "shots\sample-t$t.png" }
          $p.Kill()
      - name: Publish screenshots
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-evidence --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create ci-evidence --repo "${{ github.repository }}" --prerelease --title "CI evidence (screenshots)" --notes "Screenshots from CI test runs. Not an app build."
          for f in shots/*; do [ -e "$f" ] && cp "$f" "windows-run${{ github.run_number }}-$(basename $f)" && gh release upload ci-evidence "windows-run${{ github.run_number }}-$(basename $f)" --repo "${{ github.repository }}" --clobber; done; true
  release:
    needs: [android, windows, emulator, winshot]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: phonelink-android-apk, path: out }
      - uses: actions/download-artifact@v4
        with: { name: phonelink-windows, path: out }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/PhoneLink.apk out/PhoneLink.exe \
            --repo "${{ github.repository }}" --title "PhoneLink build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}. Debug-signed APK, unsigned Windows exe."
